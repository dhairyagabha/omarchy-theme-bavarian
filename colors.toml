# Bavarian — carbon, alpine white, Bavarian blue. Generated by bin/generate-theme.py.
#
# Level 1 structure, level 2 content, level 3 interaction,
# level 4 emphasis, level 5 exceptional. See README.md.

# Bavarian blue. Focus, selection, active state.
accent = "#2C7FD4"
# One step brighter than the accent so it is never lost.
cursor = "#5AA9F0"
# Body text. Deliberately below alpine white for long sessions.
