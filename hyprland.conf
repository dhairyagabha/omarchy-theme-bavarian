# Bavarian — carbon, alpine white, Bavarian blue. Generated by bin/generate-theme.py.
#
# Sourced by Omarchy *after* its own looknfeel.conf, so everything here wins.
#
# The active border is a short 45-degree sweep from Bavarian blue into deep
# ALPINA blue: the same idea as light travelling along a machined edge. It
# reads as one considered colour at a glance, never as a gradient effect.

$activeBorderColor = rgba(2c7fd4ed) rgba(0a2e6bed) 45deg
$inactiveBorderColor = rgba(232833ab)

general {
    border_size = 2

    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

decoration {
    # A 2px radius is the machined chamfer on a milled edge — present when you
    # look for it, invisible when you do not. Anything larger stops reading as
    # precision and starts reading as consumer software.
    rounding = 2

    # No glow. The shadow only separates a window from what is behind it.
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(0000008c)
        color_inactive = rgba(00000059)
    }

    # Blur is pulled darker and flatter than the Omarchy default so that
    # whatever is behind a translucent surface stays background, and the
    # wallpaper never competes with text sitting on top of it.
    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        brightness = 0.52
        contrast = 0.88
        vibrancy = 0.10
    }
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        # Tabs read as instrument labels: weight and a hairline carry the
        # hierarchy, colour is only used to say which one is live.
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        font_weight_active = semibold
        font_weight_inactive = normal

        height = 20
        indicator_height = 2
        indicator_gap = 4
        gaps_in = 4
        gaps_out = 0

        text_color = rgba(e9ebefff)
        text_color_inactive = rgba(6c7480ff)

        col.active = rgba(2c7fd4d9)
        col.inactive = rgba(2328338c)
        col.locked_active = rgba(d89a4ed9)
        col.locked_inactive = rgba(2328338c)

        gradients = false
        rounding = 2
    }
}
