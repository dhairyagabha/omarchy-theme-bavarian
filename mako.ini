# Bavarian — carbon, alpine white, Bavarian blue. Generated by bin/generate-theme.py.
#
# Urgency is carried by the border colour *and* by how long the notification
# stays on screen, so the three levels are still distinguishable without
# relying on hue alone.

text-color=#E9EBEF
border-color=#232833
background-color=#0E1014F5
progress-color=over #0A2E6B

width=420
height=140
padding=14
margin=8
border-size=1
border-radius=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32
icon-location=left
layer=overlay

[urgency=low]
border-color=#232833
text-color=#AEB5BE
default-timeout=4000

[urgency=normal]
border-color=#2C7FD4
text-color=#E9EBEF
default-timeout=5000

# Critical does not time out. It is the only notification allowed to be red.
[urgency=critical]
border-color=#D2544A
text-color=#E9EBEF
border-size=2
default-timeout=0

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
