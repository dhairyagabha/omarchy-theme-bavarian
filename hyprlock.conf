# Bavarian — carbon, alpine white, Bavarian blue. Generated by bin/generate-theme.py.
#
# Omarchy's hyprlock.conf consumes exactly these five variables.
# The wallpaper behind is blurred three passes, so the field has to hold its
# own edge: carbon fill, a single Bavarian blue outline, nothing else.

$color = rgba(5,7,10,1.00)
$inner_color = rgba(10,14,20,0.72)
$outer_color = rgba(44,127,212,1.00)
$font_color = rgba(230,234,240,1.00)
$check_color = rgba(79,184,206,1.00)
